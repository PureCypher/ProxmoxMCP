[project]
name = "proxmox-mcp-server"
version = "1.0.0"
description = "MCP server for Proxmox VE infrastructure management"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "proxmoxer>=2.1.0",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
proxmox-mcp = "proxmox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxmox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests requiring a live Proxmox instance"]

[tool.ruff]
target-version = "py311"
line-length = 100
